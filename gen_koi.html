<!doctype html>
<html>
<head><meta charset="utf-8"><title>Golden Koi — generator</title>
<style>html,body{margin:0;padding:0;background:#02101d}canvas{display:block}</style>
</head>
<body>
<canvas id="c" width="1024" height="1024"></canvas>
<script>
"use strict";
const cv = document.getElementById("c");
const ctx = cv.getContext("2d");
const W = 1024, H = 1024;

// Deterministic pseudo-random: fixed seed, no Math.random, no time.
let seed = 20261116;
function rnd() { seed = (seed * 1664525 + 1013904223) >>> 0; return seed / 4294967296; }
function rr(a, b) { return a + rnd() * (b - a); }

function lin(x0, y0, x1, y1, stops) {
  const g = ctx.createLinearGradient(x0, y0, x1, y1);
  for (const [o, c] of stops) g.addColorStop(o, c);
  return g;
}
function rad(x, y, r0, r1, stops) {
  const g = ctx.createRadialGradient(x, y, r0, x, y, r1);
  for (const [o, c] of stops) g.addColorStop(o, c);
  return g;
}
function ellipsePath(x, y, rx, ry) {
  ctx.beginPath();
  ctx.ellipse(x, y, rx, ry, 0, 0, Math.PI * 2);
}

/* ---------------- background: deep water at night ---------------- */
ctx.fillStyle = lin(0, 0, 0, H, [[0, "#020d18"], [0.45, "#06283a"], [0.8, "#0a3d4e"], [1, "#0d525f"]]);
ctx.fillRect(0, 0, W, H);

// warm glow behind the leaping fish
ctx.fillStyle = rad(600, 430, 40, 520, [[0, "rgba(255,190,80,0.34)"], [0.55, "rgba(255,150,50,0.12)"], [1, "rgba(255,150,50,0)"]]);
ctx.fillRect(0, 0, W, H);
// cool glow low down, around the cup
ctx.fillStyle = rad(512, 870, 20, 380, [[0, "rgba(110,220,255,0.22)"], [1, "rgba(110,220,255,0)"]]);
ctx.fillRect(0, 0, W, H);

// bokeh bubbles drifting up
for (let i = 0; i < 16; i++) {
  const x = rr(40, 984), y = rr(40, 960), r = rr(10, 46);
  ctx.fillStyle = i % 3 === 0 ? "rgba(255,200,110," + rr(0.04, 0.10).toFixed(3) + ")"
                              : "rgba(140,220,255," + rr(0.04, 0.09).toFixed(3) + ")";
  ellipsePath(x, y, r, r); ctx.fill();
  ctx.strokeStyle = "rgba(255,255,255,0.10)"; ctx.lineWidth = 1.5;
  ellipsePath(x, y, r, r); ctx.stroke();
}
// faint stars / sparkle dust
for (let i = 0; i < 46; i++) {
  ctx.fillStyle = "rgba(255,255,255," + rr(0.15, 0.55).toFixed(2) + ")";
  ctx.beginPath(); ctx.arc(rr(20, 1004), rr(20, 500), rr(0.8, 2.0), 0, Math.PI * 2); ctx.fill();
}

/* ---------------- water ribbons spiralling up from the cup ---------------- */
function ribbon(pts, width, glow) {
  ctx.save();
  ctx.lineCap = "round"; ctx.lineJoin = "round";
  ctx.shadowColor = glow; ctx.shadowBlur = 34;
  ctx.strokeStyle = "rgba(150,225,255,0.85)"; ctx.lineWidth = width;
  ctx.beginPath(); ctx.moveTo(pts[0][0], pts[0][1]);
  for (let i = 1; i + 2 < pts.length; i += 3) ctx.bezierCurveTo(pts[i][0], pts[i][1], pts[i + 1][0], pts[i + 1][1], pts[i + 2][0], pts[i + 2][1]);
  ctx.stroke();
  ctx.shadowBlur = 0;
  ctx.strokeStyle = "rgba(255,255,255,0.9)"; ctx.lineWidth = width * 0.32;
  ctx.beginPath(); ctx.moveTo(pts[0][0], pts[0][1]);
  for (let i = 1; i + 2 < pts.length; i += 3) ctx.bezierCurveTo(pts[i][0], pts[i][1], pts[i + 1][0], pts[i + 1][1], pts[i + 2][0], pts[i + 2][1]);
  ctx.stroke();
  ctx.restore();
}
// big curl rising to the right of the fish
ribbon([[512, 836], [640, 806], [724, 726], [716, 618], [640, 560], [556, 560], [512, 620]], 44, "rgba(90,200,255,0.9)");
// curl sweeping up to the left
ribbon([[512, 836], [410, 800], [348, 726], [356, 640], [420, 596], [470, 610]], 34, "rgba(90,200,255,0.9)");
// small spiral swirl right at the cup mouth
ctx.save();
ctx.lineCap = "round";
ctx.shadowColor = "rgba(140,225,255,0.95)"; ctx.shadowBlur = 22;
ctx.strokeStyle = "rgba(200,240,255,0.95)"; ctx.lineWidth = 12;
ctx.beginPath();
for (let a = 0; a < Math.PI * 4.4; a += 0.12) {
  const r = 8 + a * 7.5, x = 512 + Math.cos(a) * r, y = 828 - Math.sin(a) * r * 0.62;
  if (a === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
}
ctx.stroke();
ctx.restore();

/* ---------------- teacup: back rim + water surface ---------------- */
ctx.fillStyle = rad(512, 828, 4, 84, [[0, "rgba(190,240,255,0.95)"], [0.7, "rgba(120,210,245,0.75)"], [1, "rgba(120,210,245,0)"]]);
ellipsePath(512, 828, 82, 18); ctx.fill();
ctx.fillStyle = "#dcebf2";
ellipsePath(512, 828, 78, 15); ctx.fill();
ctx.fillStyle = "#8fd4ee";
ellipsePath(512, 828, 66, 12); ctx.fill();

/* ---------------- koi tail fin, dipping into the cup ---------------- */
function tailFin() {
  ctx.save();
  ctx.shadowColor = "rgba(255,150,40,0.85)"; ctx.shadowBlur = 26;
  const g = lin(480, 750, 480, 900, [[0, "rgba(255,160,50,0.95)"], [0.6, "rgba(255,120,25,0.78)"], [1, "rgba(255,90,10,0.5)"]]);
  ctx.fillStyle = g;
  // upper lobe, flowing down-left
  ctx.beginPath();
  ctx.moveTo(498, 746);
  ctx.bezierCurveTo(462, 792, 428, 832, 402, 872);
  ctx.bezierCurveTo(436, 876, 466, 856, 486, 828);
  ctx.bezierCurveTo(500, 804, 510, 776, 514, 752);
  ctx.closePath(); ctx.fill();
  // lower lobe, flowing down-right
  ctx.beginPath();
  ctx.moveTo(506, 750);
  ctx.bezierCurveTo(540, 800, 572, 844, 592, 882);
  ctx.bezierCurveTo(558, 888, 528, 866, 510, 836);
  ctx.bezierCurveTo(500, 810, 498, 778, 504, 750);
  ctx.closePath(); ctx.fill();
  // fin rays
  ctx.shadowBlur = 0;
  ctx.strokeStyle = "rgba(255,220,140,0.55)"; ctx.lineWidth = 2.5;
  ctx.beginPath();
  ctx.moveTo(498, 754); ctx.quadraticCurveTo(458, 800, 418, 860);
  ctx.moveTo(506, 756); ctx.quadraticCurveTo(542, 806, 578, 870);
  ctx.stroke();
  ctx.restore();
}
tailFin();

/* ---------------- koi body: outline from a centerline + width profile ---------------- */
function qbez(p0, p1, p2, t) {
  const u = 1 - t;
  return [u * u * p0[0] + 2 * u * t * p1[0] + t * t * p2[0],
          u * u * p0[1] + 2 * u * t * p1[1] + t * t * p2[1]];
}
function qtan(p0, p1, p2, t) {
  return [2 * (1 - t) * (p1[0] - p0[0]) + 2 * t * (p2[0] - p1[0]),
          2 * (1 - t) * (p1[1] - p0[1]) + 2 * t * (p2[1] - p1[1])];
}
const C0 = [495, 755], C1 = [620, 560], C2 = [835, 300];
const WIDTHS = [[0, 26], [0.25, 62], [0.5, 78], [0.75, 62], [1, 30]];
const bellyPts = [], backPts = [];
for (const [t, w] of WIDTHS) {
  const [x, y] = qbez(C0, C1, C2, t);
  const [tx, ty] = qtan(C0, C1, C2, t);
  const len = Math.hypot(tx, ty);
  const nx = -ty / len, ny = tx / len;      // (nx,ny) points down-right = belly side
  bellyPts.push([x + nx * w, y + ny * w]);
  backPts.push([x - nx * w, y - ny * w]);
}
const noseTip = [846, 286];
function smoothChain(pts) {
  // quadratic chain through pts WITHOUT a moveTo: continues the current subpath
  for (let i = 1; i < pts.length - 1; i++) {
    const mx = (pts[i][0] + pts[i + 1][0]) / 2, my = (pts[i][1] + pts[i + 1][1]) / 2;
    ctx.quadraticCurveTo(pts[i][0], pts[i][1], mx, my);
  }
  ctx.lineTo(pts[pts.length - 1][0], pts[pts.length - 1][1]);
}
function bodyPath() {
  // ONE continuous closed loop: belly edge, nose, back edge, close.
  // (A moveTo in the middle would split it into two subpaths whose
  // windings cancel in the middle and leave a hole.)
  ctx.beginPath();
  ctx.moveTo(bellyPts[0][0], bellyPts[0][1]);
  smoothChain(bellyPts);
  ctx.quadraticCurveTo(noseTip[0], noseTip[1], backPts[backPts.length - 1][0], backPts[backPts.length - 1][1]);
  smoothChain(backPts.slice().reverse());
  ctx.closePath();
}
ctx.save();
ctx.shadowColor = "rgba(255,175,55,0.95)"; ctx.shadowBlur = 55;
ctx.fillStyle = lin(500, 760, 830, 290, [[0, "#c85a00"], [0.35, "#f07f12"], [0.65, "#ffb52e"], [0.9, "#ffd964"], [1, "#ffe98a"]]);
bodyPath(); ctx.fill();
ctx.restore();

// scales, clipped to the body
ctx.save();
bodyPath(); ctx.clip();
ctx.fillStyle = "rgba(255,243,196,0.18)";
ctx.beginPath();
ctx.ellipse(660, 521, 120, 58, -0.92, 0, Math.PI * 2); ctx.fill();   // pale belly glow
ctx.strokeStyle = "rgba(150,62,0,0.34)"; ctx.lineWidth = 2;
ctx.fillStyle = "rgba(255,214,110,0.14)";
for (let row = 0; row < 11; row++) {
  const y = 320 + row * 42;
  for (let col = 0; col < 12; col++) {
    const x = 430 + col * 38 + (row % 2 ? 19 : 0);
    ctx.beginPath(); ctx.arc(x, y, 16, 0.15 * Math.PI, 0.85 * Math.PI); ctx.stroke();
    ctx.beginPath(); ctx.arc(x, y, 16, 0.15 * Math.PI, 0.85 * Math.PI); ctx.fill();
  }
}
// (no saddle stripe: the scales and gradient carry the back on their own)
ctx.restore();

// body outline, thin and warm
ctx.save();
ctx.strokeStyle = "rgba(120,45,0,0.55)"; ctx.lineWidth = 3;
bodyPath(); ctx.stroke();
ctx.restore();

/* ---------------- fins ---------------- */
// dorsal fin on the back: a low ridge hugging the back edge
ctx.save();
ctx.shadowColor = "rgba(255,150,40,0.8)"; ctx.shadowBlur = 18;
ctx.fillStyle = "rgba(255,140,35,0.62)";
ctx.beginPath();
ctx.moveTo(556, 545);
ctx.quadraticCurveTo(535, 505, 552, 475);
ctx.quadraticCurveTo(585, 462, 618, 452);
ctx.quadraticCurveTo(605, 490, 580, 520);
ctx.quadraticCurveTo(568, 535, 556, 545);
ctx.closePath(); ctx.fill();
ctx.restore();
// pectoral fin sweeping back under the head
ctx.save();
ctx.shadowColor = "rgba(255,150,40,0.8)"; ctx.shadowBlur = 16;
ctx.fillStyle = "rgba(255,150,45,0.58)";
ctx.beginPath();
ctx.moveTo(745, 462);
ctx.bezierCurveTo(716, 492, 694, 528, 686, 566);
ctx.bezierCurveTo(724, 548, 762, 516, 790, 500);
ctx.bezierCurveTo(776, 482, 760, 470, 745, 462);
ctx.closePath(); ctx.fill();
ctx.restore();

/* ---------------- head: eye, gill, whiskers, mouth ---------------- */
// (no gill line: a stroked gill reads as a scratch across the scales)

// whiskers (barbels) from the mouth
ctx.save();
ctx.strokeStyle = "rgba(255,225,150,0.95)"; ctx.lineWidth = 3.5; ctx.lineCap = "round";
ctx.shadowColor = "rgba(255,200,90,0.9)"; ctx.shadowBlur = 8;
ctx.beginPath(); ctx.moveTo(836, 300); ctx.quadraticCurveTo(876, 326, 898, 378); ctx.stroke();
ctx.beginPath(); ctx.moveTo(832, 312); ctx.quadraticCurveTo(862, 350, 870, 400); ctx.stroke();
ctx.restore();
// mouth
ctx.save();
ctx.strokeStyle = "rgba(120,45,0,0.7)"; ctx.lineWidth = 4; ctx.lineCap = "round";
ctx.beginPath(); ctx.moveTo(822, 296); ctx.quadraticCurveTo(836, 306, 840, 320); ctx.stroke();
ctx.restore();
// eye
ctx.save();
ctx.fillStyle = "#fff8e6"; ellipsePath(782, 338, 17, 17); ctx.fill();
ctx.fillStyle = "#e8a020"; ellipsePath(784, 339, 11, 11); ctx.fill();
ctx.fillStyle = "#160b00"; ellipsePath(786, 340, 5.5, 5.5); ctx.fill();
ctx.fillStyle = "rgba(255,255,255,0.95)"; ellipsePath(778, 333, 3.4, 3.4); ctx.fill();
ctx.restore();

/* ---------------- teacup: front wall, handle, saucer ---------------- */
ctx.save();
ctx.shadowColor = "rgba(0,0,0,0.35)"; ctx.shadowBlur = 18; ctx.shadowOffsetY = 6;
// saucer
ctx.fillStyle = lin(400, 920, 624, 950, [[0, "#9db8c6"], [0.5, "#dcebf2"], [1, "#8fa9b8"]]);
ellipsePath(512, 934, 112, 17); ctx.fill();
// cup front wall
ctx.fillStyle = lin(436, 828, 588, 936, [[0, "#ffffff"], [0.45, "#eef6fa"], [1, "#b9d2de"]]);
ctx.beginPath();
ctx.moveTo(434, 830);
ctx.lineTo(590, 830);
ctx.bezierCurveTo(584, 884, 566, 922, 512, 928);
ctx.bezierCurveTo(458, 922, 440, 884, 434, 830);
ctx.closePath(); ctx.fill();
// blue band under the rim
ctx.fillStyle = "#2f6ea5";
ctx.beginPath();
ctx.moveTo(436, 842); ctx.lineTo(588, 842); ctx.lineTo(586, 856); ctx.lineTo(438, 856); ctx.closePath(); ctx.fill();
// tiny blue flower on the cup
ctx.fillStyle = "#2f6ea5";
for (let i = 0; i < 5; i++) {
  const a = i * Math.PI * 2 / 5 - Math.PI / 2;
  ellipsePath(512 + Math.cos(a) * 9, 892 + Math.sin(a) * 9, 4.5, 4.5); ctx.fill();
}
ctx.fillStyle = "#e8a020"; ellipsePath(512, 892, 4, 4); ctx.fill();
// handle
ctx.strokeStyle = "#d7e6ee"; ctx.lineWidth = 11; ctx.lineCap = "round";
ctx.beginPath(); ctx.arc(600, 878, 26, -Math.PI * 0.42, Math.PI * 0.42); ctx.stroke();
ctx.strokeStyle = "rgba(90,120,140,0.5)"; ctx.lineWidth = 2;
ctx.beginPath(); ctx.arc(600, 878, 26, -Math.PI * 0.42, Math.PI * 0.42); ctx.stroke();
ctx.restore();

/* ---------------- paper boat riding the crest ---------------- */
ctx.save();
ctx.translate(396, 792); ctx.rotate(-0.28);
ctx.shadowColor = "rgba(0,0,0,0.3)"; ctx.shadowBlur = 8; ctx.shadowOffsetY = 4;
ctx.fillStyle = "#ffffff";
ctx.beginPath(); ctx.moveTo(-34, 0); ctx.lineTo(34, 0); ctx.lineTo(16, 16); ctx.lineTo(-16, 16); ctx.closePath(); ctx.fill();
ctx.fillStyle = "#dbe8ef";
ctx.beginPath(); ctx.moveTo(-34, 0); ctx.lineTo(0, 0); ctx.lineTo(-16, 16); ctx.closePath(); ctx.fill();
ctx.fillStyle = "#f4f9fb";
ctx.beginPath(); ctx.moveTo(-16, 0); ctx.lineTo(16, 0); ctx.lineTo(0, -26); ctx.closePath(); ctx.fill();
ctx.strokeStyle = "rgba(90,120,140,0.55)"; ctx.lineWidth = 1.6;
ctx.beginPath(); ctx.moveTo(-34, 0); ctx.lineTo(34, 0); ctx.lineTo(16, 16); ctx.lineTo(-16, 16); ctx.closePath(); ctx.stroke();
ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(0, -26); ctx.stroke();
ctx.restore();

/* ---------------- droplets and sparkles in front ---------------- */
for (let i = 0; i < 26; i++) {
  const x = rr(300, 950), y = rr(240, 860), r = rr(3, 11);
  ctx.fillStyle = "rgba(190,235,255," + rr(0.5, 0.9).toFixed(2) + ")";
  ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = "rgba(255,255,255,0.9)";
  ctx.beginPath(); ctx.arc(x - r * 0.35, y - r * 0.35, r * 0.32, 0, Math.PI * 2); ctx.fill();
}
// four-point gold sparkles
function sparkle(x, y, s, a) {
  ctx.save(); ctx.translate(x, y); ctx.rotate(0.4);
  ctx.fillStyle = "rgba(255,215,120," + a + ")";
  ctx.beginPath();
  ctx.moveTo(0, -s); ctx.quadraticCurveTo(s * 0.18, -s * 0.18, s, 0);
  ctx.quadraticCurveTo(s * 0.18, s * 0.18, 0, s);
  ctx.quadraticCurveTo(-s * 0.18, s * 0.18, -s, 0);
  ctx.quadraticCurveTo(-s * 0.18, -s * 0.18, 0, -s);
  ctx.fill(); ctx.restore();
}
sparkle(880, 210, 26, 0.95); sparkle(700, 150, 17, 0.8); sparkle(300, 420, 15, 0.75);
sparkle(930, 520, 19, 0.85); sparkle(180, 700, 13, 0.7); sparkle(620, 760, 12, 0.7);

/* ---------------- vignette + caption ---------------- */
ctx.fillStyle = rad(512, 512, 380, 760, [[0, "rgba(0,0,8,0)"], [1, "rgba(0,0,10,0.42)"]]);
ctx.fillRect(0, 0, W, H);
ctx.save();
ctx.fillStyle = "rgba(255,255,255,0.82)";
ctx.font = "italic 30px Georgia, serif";
ctx.textAlign = "center";
ctx.shadowColor = "rgba(0,0,0,0.6)"; ctx.shadowBlur = 8;
ctx.fillText("too big for its cup", 512, 992);
ctx.restore();
</script>
</body>
</html>
